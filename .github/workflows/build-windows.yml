# Push this folder to GitHub and the Actions tab produces a ready-to-copy Windows build.
name: build-windows
# Every push builds and self-tests the .exe. When main carries a version (em31mapper/__init__.py) that
# has no release yet -- or a matching v* tag is pushed -- EM31Mapper.zip is published as a GitHub Release,
# downloadable without a GitHub account at .../releases/latest/download/EM31Mapper.zip
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write          # needed only to create the release
jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing (Azure Trusted / Artifact Signing, Aesir Consulting LLC) runs only when this
      # secret is set, so builds still work without it. Secrets needed, as for Yggdrasil:
      #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET  (service principal with the
      #     "Trusted Signing Certificate Profile Signer" role)
      #   AZURE_CODESIGNING_ENDPOINT / AZURE_CODESIGNING_ACCOUNT / AZURE_CODESIGNING_PROFILE
      SIGNING_ACCOUNT: ${{ secrets.AZURE_CODESIGNING_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python run_em31mapper.py --selftest --quiet
        env: { QT_QPA_PLATFORM: offscreen }
      - run: python -m pytest -q tests
      - run: pyinstaller --noconfirm EM31Mapper.spec
      - name: Sign EM31Mapper.exe (Azure Trusted Signing - gated)
        if: ${{ env.SIGNING_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODESIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CODESIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\EM31Mapper
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com/
          timestamp-digest: SHA256
      - name: Check the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/EM31Mapper/EM31Mapper.exe
          Write-Host "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($env:SIGNING_ACCOUNT -and ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Aesir Consulting LLC')) {
            Write-Error "EM31Mapper.exe is not validly signed by Aesir Consulting LLC"; exit 1
          }
          if (-not $env:SIGNING_ACCOUNT) { Write-Host "Signing not configured: this build is unsigned." }
      - name: Self-test the built .exe
        shell: pwsh
        env: { QT_QPA_PLATFORM: offscreen }
        # EM31Mapper.exe is a windowed program: PowerShell won't wait for it unless told to
        run: |
          $p = Start-Process dist/EM31Mapper/EM31Mapper.exe -ArgumentList '--selftest','--quiet' -Wait -PassThru
          Get-Content "$env:USERPROFILE/Documents/EM31Mapper/selftest.txt"
          exit $p.ExitCode
      - name: Add quick-start text to the program folder
        shell: pwsh
        run: Copy-Item README-FIRST.txt dist/EM31Mapper/
      - uses: actions/upload-artifact@v4
        with: { name: EM31Mapper-windows, path: dist/EM31Mapper }
      - name: Decide whether to publish a release
        id: rel
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $v = "v" + (python -c "import em31mapper; print(em31mapper.__version__)")
          if ("${{ github.ref_type }}" -eq "tag") {
            if ($v -ne "${{ github.ref_name }}") { Write-Error "Tag ${{ github.ref_name }} but program version is $v"; exit 1 }
          } elseif ("${{ github.ref_name }}" -ne "main") {
            "publish=false" >> $env:GITHUB_OUTPUT; exit 0
          }
          gh release view $v *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $v already exists - nothing to publish"
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Publishing release $v"
            "publish=true" >> $env:GITHUB_OUTPUT; "tag=$v" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - name: Package and publish the release
        if: steps.rel.outputs.publish == 'true'
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          Compress-Archive -Path dist/EM31Mapper -DestinationPath EM31Mapper.zip
          gh release create "${{ steps.rel.outputs.tag }}" EM31Mapper.zip --target "${{ github.sha }}" `
            --title "EM31 Mapper ${{ steps.rel.outputs.tag }}" --notes-file .github/release-notes.md
